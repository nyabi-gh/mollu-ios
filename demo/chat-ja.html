<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<title>ゆい</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, "Hiragino Sans", sans-serif;
    background: #eef1f6; color: #1c1c1e;
    display: flex; flex-direction: column; min-height: 100dvh;
  }
  header {
    background: #fff; padding: calc(env(safe-area-inset-top) + 10px) 16px 10px;
    display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #e3e6ec;
  }
  .back { font-size: 26px; color: #5b5bd6; line-height: 1; }
  .avatar { width: 38px; height: 38px; border-radius: 50%; background: linear-gradient(135deg,#ffb4c6,#ffd6a5); display: grid; place-items: center; font-size: 20px; }
  .who b { display: block; font-size: 17px; }
  .who span { font-size: 12px; color: #34a853; }
  main { flex: 1; padding: 16px 12px; display: flex; flex-direction: column; gap: 10px; }
  .day { align-self: center; font-size: 12px; color: #6e6e73; background: #dde2ea; padding: 3px 10px; border-radius: 10px; margin: 4px 0 6px; }
  .row { display: flex; align-items: flex-end; gap: 6px; }
  .row.me { flex-direction: row-reverse; }
  .bubble { max-width: 74%; padding: 9px 13px; border-radius: 18px; font-size: 16px; line-height: 1.45; }
  .them .bubble { background: #fff; border-bottom-left-radius: 6px; }
  .me .bubble { background: #5b5bd6; color: #fff; border-bottom-right-radius: 6px; }
  .time { font-size: 11px; color: #8e8e93; white-space: nowrap; }
  .sticker { font-size: 56px; line-height: 1; }
  footer {
    background: #fff; padding: 8px 12px calc(env(safe-area-inset-bottom) + 8px);
    display: flex; gap: 10px; align-items: center; border-top: 1px solid #e3e6ec;
  }
  .input { flex: 1; background: #f1f2f6; border-radius: 18px; padding: 9px 14px; color: #8e8e93; font-size: 15px; }
  .send { width: 36px; height: 36px; border-radius: 50%; background: #5b5bd6; color: #fff; display: grid; place-items: center; font-size: 18px; }
</style>
</head>
<body>
<header>
  <span class="back">‹</span>
  <div class="avatar">🌸</div>
  <div class="who"><b>ゆい</b><span>オンライン</span></div>
</header>
<main>
  <div class="day">今日</div>
  <div class="row them"><div class="bubble">ねえ、明日ひま？😊</div><span class="time">14:02</span></div>
  <div class="row them"><div class="bubble">駅前に新しいカフェができたんだって！一緒に行かない？</div><span class="time">14:02</span></div>
  <div class="row me"><div class="bubble">行きたい！何時がいい？</div><span class="time">14:05</span></div>
  <div class="row them"><div class="bubble">お昼すぎはどう？2時に改札の前で待ち合わせしよう</div><span class="time">14:06</span></div>
  <div class="row them"><div class="bubble">パンケーキがすごく美味しいらしいよ🥞</div><span class="time">14:06</span></div>
  <div class="row me"><div class="bubble">最高！楽しみにしてるね</div><span class="time">14:08</span></div>
  <div class="row them"><div class="sticker">🐱</div></div>
  <div class="row them"><div class="bubble">じゃあ明日ね！遅れないでよ〜</div><span class="time">14:09</span></div>
</main>
<footer>
  <div class="input">メッセージを入力</div>
  <div class="send">↑</div>
</footer>
</body>
</html>
