<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#2b2f5c">
<title>星降る丘</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body {
    font-family: -apple-system, "Hiragino Sans", sans-serif; color: #fff; min-height: 100dvh; overflow: hidden;
    background: linear-gradient(180deg,#1d2150 0%,#4b3f86 45%,#f39c8f 78%,#ffd29a 100%);
    position: relative;
  }
  .stars { position: absolute; inset: 0; background-image:
    radial-gradient(2px 2px at 20% 12%, #fff, transparent), radial-gradient(1.5px 1.5px at 70% 8%, #fff, transparent),
    radial-gradient(2px 2px at 85% 22%, #fff, transparent), radial-gradient(1.5px 1.5px at 40% 25%, #fff, transparent),
    radial-gradient(1.5px 1.5px at 10% 30%, #fff, transparent), radial-gradient(2px 2px at 55% 16%, #fff, transparent); }
  .moon { position: absolute; top: 90px; right: 40px; width: 70px; height: 70px; border-radius: 50%; background: #fff6d6; box-shadow: 0 0 40px #fff3b0; }
  .hill { position: absolute; left: -10%; right: -10%; bottom: 0; height: 36%; background: #2b2f5c; border-radius: 50% 50% 0 0; }
  .chara { position: absolute; left: 50%; bottom: 30%; transform: translateX(-50%); font-size: 150px; line-height: 1; }
  .hud { position: absolute; top: calc(env(safe-area-inset-top) + 10px); left: 14px; right: 14px; display: flex; justify-content: space-between; font-size: 13px; }
  .hud span { background: rgba(0,0,0,.45); padding: 5px 10px; border-radius: 12px; }
  .choices { position: absolute; left: 24px; right: 24px; bottom: calc(env(safe-area-inset-bottom) + 210px); display: flex; flex-direction: column; gap: 10px; }
  .choice { background: rgba(255,255,255,.92); color: #2b2f5c; text-align: center; padding: 12px; border-radius: 12px; font-size: 16px; font-weight: 600; }
  .box { position: absolute; left: 12px; right: 12px; bottom: calc(env(safe-area-inset-bottom) + 16px); background: rgba(20,22,48,.92); border: 2px solid #c9b6ff; border-radius: 16px; padding: 26px 18px 18px; min-height: 170px; }
  .name { position: absolute; top: -16px; left: 16px; background: #c9b6ff; color: #1d2150; font-weight: 700; padding: 5px 14px; border-radius: 10px; font-size: 15px; }
  .line { font-size: 17px; line-height: 1.6; }
  .next { position: absolute; right: 16px; bottom: 10px; font-size: 14px; color: #c9b6ff; }
</style>
</head>
<body>
<div class="stars"></div>
<div class="moon"></div>
<div class="hill"></div>
<div class="chara">🧙‍♀️</div>
<div class="hud"><span>第3章　約束の丘</span><span>セーブ</span></div>
<div class="choices">
  <div class="choice">もちろん覚えてるよ</div>
  <div class="choice">……何の話だっけ？</div>
</div>
<div class="box">
  <div class="name">ミナ</div>
  <div class="line">ねえ、子どものころにここでした約束、まだ覚えてる？流れ星が見えたら、一緒に旅に出ようって。</div>
  <div class="next">▼</div>
</div>
</body>
</html>
